resources:
  jobs:
    deploy_data_ops_wheel:
      name: "[${bundle.target}] Deploy data_ops Wheel"
      description: >
        Builds and tests the data_ops wheel locally, then copies it to the gold
        volumes so it is available for team development and job dependencies.

      tasks:
        - task_key: copy_wheel_to_volume
          environment_key: default
          spark_python_task:
            python_file: ${workspace.root_path}/files/domains/ops/deploy_wheel.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--wheel-path"
              - "${workspace.root_path}/artifacts/.internal/data_ops-0.1.0-py3-none-any.whl"

      environments:
        - environment_key: default
          spec:
            client: "2"

      tags:
        domain: ops
        layer: gold
        pipeline: deploy
